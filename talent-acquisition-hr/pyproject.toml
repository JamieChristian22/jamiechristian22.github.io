[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-hr-operations-portfolio"
version = "2.0.0"
description = "Synthetic talent acquisition and HR operations analytics portfolio"
requires-python = ">=3.10"
authors = [{name = "Portfolio case-study project"}]
license = {text = "MIT"}

[project.scripts]
tahr = "tahr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
