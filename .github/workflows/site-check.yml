name: Portfolio static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate homepage structure and local links
        run: python tools/check_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test category filters and accessible selection state
        run: node tools/check_filter.mjs
